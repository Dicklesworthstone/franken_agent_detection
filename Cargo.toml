[package]
name = "franken-agent-detection"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local coding-agent installation detection via filesystem probes"
repository = "https://github.com/Dicklesworthstone/franken_agent_detection"
documentation = "https://docs.rs/franken-agent-detection"
readme = "README.md"
keywords = ["agent", "detection", "filesystem", "codex", "claude"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# --- Always-on (detection + connector shared) ---
serde = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

# --- Optional: connector infrastructure ---
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
dotenvy = { version = "0.15", optional = true }
bloomfilter = { version = "3", optional = true }
once_cell = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }

# --- Optional: ChatGPT encrypted conversations ---
aes-gcm = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
blake3 = { version = "1", optional = true }
url = { version = "2", optional = true }

# --- Optional: SQLite-backed session databases ---
frankensqlite = { version = "0.3.8", package = "fsqlite", optional = true }
# Drives fsqlite's async (!Send) engine futures to completion behind the
# connectors' synchronous API surface (see connectors/sqlite_sync.rs).
# fsqlite 0.3 names asupersync 0.4.x types in its public API, so the two
# must move in lockstep (asupersync 0.3.x and 0.4.x are non-interchangeable).
asupersync = { version = "0.4.9", default-features = false, optional = true }

[features]
default = []
# Base connector support: shared deps for built-in non-SQLite connectors
connectors = [
    "dep:anyhow",
    "dep:serde_json",
    "dep:walkdir",
    "dep:tracing",
    "dep:dotenvy",
    "dep:bloomfilter",
    "dep:once_cell",
]
# ChatGPT: AES-256-GCM decryption for v2/v3 encrypted conversations
chatgpt = ["connectors", "dep:aes-gcm", "dep:base64"]
# Cursor: SQLite database access for state.vscdb
cursor = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync"]
# OpenCode: SQLite database access for v1.2+ opencode.db
opencode = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync"]
# Goose: SQLite database access for Goose sessions.db
goose = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync"]
# Hermes: SQLite database access for Hermes Agent state.db
hermes = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync"]
# Crush: SQLite database access for Charm's Crush agent
crush = ["connectors", "dep:frankensqlite", "dep:asupersync"]
# Devin CLI: read-only access to the shared ~/.local/share/devin/cli/sessions.db
# (cass #449). Without it the devin connector is detection-only.
devin = ["connectors", "dep:frankensqlite", "dep:urlencoding", "dep:asupersync"]
# Shelley (boldsoftware/shelley): schema-aware read-only access to Shelley's
# one-database-many-conversations shelley.db (WAL mode; cass gh#415). fts5 is
# required because Shelley's schema declares an FTS5 messages index.
shelley = [
    "connectors",
    "dep:frankensqlite",
    "frankensqlite/fts5",
    "dep:asupersync",
    "dep:blake3",
    "dep:base64",
    "dep:url",
]
# OpenClaw 2.0 (v2026.8.1+): per-agent SQLite transcript store at
# agents/<agent>/agent/openclaw-agent.sqlite (transcript_events rows). Legacy
# JSONL sessions need no SQLite and remain available with the base
# `connectors` feature.
openclaw-sqlite = ["connectors", "dep:frankensqlite", "dep:asupersync"]
# Copilot legacy generation: pre-March-2025 VS Code chat sessions stored in
# workspace/global `state.vscdb` (`ItemTable` key `interactive.sessions`).
# The newer flat-JSON and append-log `chatSessions` generations need no SQLite
# and are always available with the base `connectors` feature.
copilot-vscdb = ["connectors", "dep:frankensqlite", "dep:asupersync"]
# All connectors enabled
all-connectors = [
    "connectors",
    "chatgpt",
    "cursor",
    "opencode",
    "goose",
    "hermes",
    "crush",
    "shelley",
    "openclaw-sqlite",
    "copilot-vscdb",
]

[dev-dependencies]
tempfile = "3.27"
serial_test = "4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# clippy::assert_is_empty landed in pedantic on the floating nightly
# (2026-08 toolchain drift) and flags ~35 pre-existing test assertions of
# the form `assert!(x.is_empty())` across connectors. The lint offers no
# mechanical rewrite; keep the established assertion style until then.
assert_is_empty = "allow"

# fsqlite's async engine builds enormous debug-mode futures; at opt-level 0
# a single statement poll can overflow a 2 MiB test-thread stack. Upstream
# frankensqlite itself develops at `[profile.dev] opt-level = 1` for the same
# reason. Applies to dependencies only, never this crate's own test code.
[profile.dev.package."*"]
opt-level = 1
