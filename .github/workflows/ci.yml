name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check detection-only (no default features)
        run: cargo test --locked --all-targets --no-default-features

      - name: Check non-SQLite connectors
        run: cargo clippy --locked --all-targets --no-default-features --features connectors,codex-zstd,chatgpt -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --locked --all-targets --all-features

      - name: Package check
        run: cargo package --locked --allow-dirty
